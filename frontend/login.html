<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — PetroNexus Drilling Console</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <header class="pn-topbar">
    <a href="/" class="pn-brand">
      <div class="pn-brand-logo">PN</div>
      <span>PetroNexus</span>
    </a>
    <div>
      <a href="/" class="pn-btn"><i class="bi bi-arrow-left"></i> Back to Home</a>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
    <div class="pn-card" style="width: 100%; max-width: 440px; padding: 2rem;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <div class="pn-brand-logo" style="width: 40px; height: 40px; font-size: 1.2rem; margin: 0 auto 0.75rem;">PN</div>
        <h4 style="color: #fff; font-weight: 700; margin-bottom: 0.25rem;">Drilling Engineer Login</h4>
        <span style="font-size: 0.8rem; color: var(--pn-text-muted);">Oil India Limited • eRTMAC Integrated Console</span>
      </div>

      <div id="errorAlert" class="alert alert-danger" style="display: none; font-size: 0.82rem;"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label" style="font-size: 0.8rem; color: var(--pn-text-dim); text-transform: uppercase;">Employee Email</label>
          <input type="email" id="email" class="pn-input w-100" placeholder="engineer@oilindia.in" required>
        </div>
        <div class="mb-3">
          <label class="form-label" style="font-size: 0.8rem; color: var(--pn-text-dim); text-transform: uppercase;">Password</label>
          <input type="password" id="password" class="pn-input w-100" placeholder="••••••••" required>
        </div>
        <button type="submit" class="pn-btn pn-btn-primary w-100" style="padding: 0.65rem; margin-top: 0.5rem; justify-content: center;">
          <i class="bi bi-shield-lock"></i> Authenticate & Enter Console
        </button>
      </form>

      <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--pn-border-subtle); text-align: center;">
        <button type="button" id="fillDemoCredentials" class="pn-btn pn-btn-sm" style="width: 100%; justify-content: center; margin-bottom: 0.75rem;">
          <i class="bi bi-key"></i> Quick Fill Demo Engineer Credentials
        </button>
        <span style="font-size: 0.78rem; color: var(--pn-text-dim);">
          Need an account? <a href="/register.html">Register here</a>
        </span>
      </div>
    </div>
  </main>

  <div class="pn-disclaimer-banner">
    <i class="bi bi-info-circle-fill"></i>
    <span>DEMONSTRATION SYSTEM: Role restricted to <b>DRILLING_ENGINEER</b> for SIH26121.</span>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
